openapi: 3.0.0
info:
  title: Cookoff 11.0 Backend API
  version: 1.0.0
  description: >
    CodeChefVIT Cookoff 11.0 Backend API documentation, extracted directly from Go Echo v4 source code (`cookoff-11.0-be`).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: System
    description: Health check and API documentation endpoints
  - name: Auth
    description: Google OAuth 2.0 authentication and session management
  - name: Dashboard & Timer
    description: Participant dashboard and active contest timer information
  - name: Submissions & Results
    description: Code submission, execution via Judge0, and result querying
  - name: Visual Submissions
    description: Round 1 block-based Scratch question attempts and submissions
  - name: Attempts & Buy-Ins
    description: Question attempts and round 2 buy-in unlocks
  - name: Questions
    description: Participant question listing, question details, and Scratch visual blocks
  - name: Testcases
    description: Public sample testcases and administrative testcase management

  - name: Admin Question Management
    description: Administrative question creation, update, deletion, and bounty management
  - name: Admin User Management
    description: User moderation, banning/unbanning, manual round upgrades, and bulk round promotions
  - name: Admin Contest Control
    description: Contest timer setup, round start/reset, leaderboard, and system analytics

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Verifies external connectivity to PostgreSQL database pool and Redis cache.
      responses:
        "200":
          description: All backend services operational.
          content:
            application/json:
              example:
                success: true
                message: "Health check completed"
                data:
                  postgres: "OK"
                  redis: "OK"
        "503":
          description: One or more dependencies are unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /docs:
    get:
      tags:
        - System
      summary: Interactive API documentation UI
      description: Renders interactive API documentation via Scalar API reference UI.
      responses:
        "200":
          description: HTML page rendering Scalar API Documentation.

  /auth/google:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth flow
      description: Redirects participant browser to Google OAuth 2.0 authorization endpoint.
      responses:
        "302":
          description: Redirect to Google authorization URL.

  /auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth callback handler
      description: Exchanges auth code for user profile, provisions/fetches user, and sets secure JWT cookies.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend dashboard upon successful authentication or login error redirect (?error=...).
        "401":
          description: Invalid authentication code or unauthorized domain.

  /api/v1/auth/google:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth flow (Legacy Alias)
      description: Alias for `/auth/google` to support legacy Google Console redirect URIs.
      responses:
        "302":
          description: Redirect to Google authorization URL.

  /api/v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth callback handler (Legacy Alias)
      description: Alias for `/auth/google/callback`.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend dashboard.

  /refreshToken:
    post:
      tags:
        - Auth
      summary: Refresh JWT access token
      description: Uses valid refresh token cookie to issue a new access token cookie.
      responses:
        "200":
          description: Token refreshed successfully.
        "401":
          description: Missing or expired refresh token.

  /logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: Invalidates active JWT session and clears cookies.
      responses:
        "200":
          description: Logged out successfully.

  /dashboard:
    get:
      tags:
        - Dashboard & Timer
      summary: Fetch participant dashboard summary
      description: Returns participant profile, current balance, score, qualified round, and per-question attempt status.
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Dashboard retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponseEnvelope"
        "401":
          description: Unauthorized or missing authentication cookie.

  /getTime:
    get:
      tags:
        - Dashboard & Timer
      summary: Get active contest timer status
      description: Returns current active contest round, timer status (running/paused), duration, start/end time, and remaining seconds.
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Timer status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerResponseEnvelope"

  /submit:
    post:
      tags:
        - Submissions & Results
      summary: Submit code for judging (Round 2 and Round 3)
      description: Submits source code for a Round 2 or 3 coding question to Judge0 for evaluation.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "200":
          description: Code submission accepted and enqueued for evaluation.
          content:
            application/json:
              example:
                success: true
                message: "Submission created"
                data:
                  submission_id: "7f9e4210-91ab-4c3e-812d-0123456789ab"
        "400":
          description: Invalid payload or attempting Round 1 submission via code endpoint (VALIDATION).
        "403":
          description: User not qualified for question round (NOT_QUALIFIED) or question not purchased (NOT_PURCHASED).
        "423":
          description: Contest timer is not currently running for this round (ROUND_NOT_RUNNING).

  /result/{submission_id}:
    get:
      tags:
        - Submissions & Results
      summary: Get code submission verdict (Server Long Polling)
      description: Holds connection up to 90s until terminal verdict is published via Redis or database query completes.
      security:
        - CookieAuth: []
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Terminal submission result retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultResponseEnvelope"
        "404":
          description: Submission ID not found (NOT_FOUND).
        "408":
          description: Submission is still being evaluated by Judge0 worker (STILL_JUDGING).

  /submit/visual:
    post:
      tags:
        - Visual Submissions
      summary: Submit Round 1 Scratch visual solution
      description: Submits arranged visual block IDs for a Round 1 question and evaluates against valid solutions inline.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVisualSolutionRequest"
      responses:
        "200":
          description: Solution submitted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitVisualSolutionResponseEnvelope"
        "400":
          description: Invalid block IDs or empty block sequence (VALIDATION).
        "423":
          description: Contest timer is not currently running for Round 1 (ROUND_NOT_RUNNING).

  /attempts/{id}:
    post:
      tags:
        - Attempts & Buy-Ins
      summary: Create or purchase question attempt
      description: Deducts question buy_in cost (if applicable) and marks question as attempted/bought.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Question ID to unlock or attempt
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attempt created or unlocked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResponseEnvelope"
        "402":
          description: Insufficient balance for question buy_in (INSUFFICIENT_BALANCE).
        "409":
          description: Question attempt already unlocked or active (ALREADY_EXISTS).
        "423":
          description: Contest timer is not currently running for this round (ROUND_NOT_RUNNING).

  /runcode:
    post:
      tags:
        - Submissions & Results
      summary: Run code against public sample testcases
      description: Synchronously executes code against a question's public sample testcases via Judge0.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "200":
          description: Sample execution completed.

  /runcustom:
    post:
      tags:
        - Submissions & Results
      summary: Run code against custom user input (stdin)
      description: Synchronously executes source code against custom stdin input string via Judge0 sandbox.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomSubmissionRequest"
      responses:
        "200":
          description: Custom execution completed.

  /question/round:
    get:
      tags:
        - Questions
      summary: List questions for qualified round
      description: Returns all questions available for the logged-in user's current qualified round (`WHERE q.round = u.round_qualified`).
      security:
        - CookieAuth: []
      responses:
        "200":
          description: List of questions retrieved.

  /question/{id}/blocks:
    get:
      tags:
        - Questions
      summary: List Scratch visual blocks for Round 1 question
      description: Fetches all available visual code blocks for a specified Round 1 question (`WHERE q.round = 1 AND q.q_type = 'visual'`).
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Visual blocks retrieved.

  /question/{id}/testcases/public:
    get:
      tags:
        - Testcases
      summary: Get public testcases for a question
      description: Returns non-hidden sample testcases (`WHERE hidden = false`) for preview in the workspace editor.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public testcases retrieved.

  /question:
    get:
      tags:
        - Admin Question Management
      summary: List all questions (Admin)
      description: Administrative endpoint returning all questions across all rounds.
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Questions list retrieved.

    post:
      tags:
        - Admin Question Management
      summary: Create new question (Admin)
      description: Creates a new problem statement with specified round, points, buy_in, and reward.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionRequest"
      responses:
        "200":
          description: Question created.

  /question/{id}:
    get:
      tags:
        - Questions
      summary: Get question by ID
      description: Fetches full question details including title, description, constraints, and sample I/O.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Question details retrieved.
        "404":
          description: Question not found.

    put:
      tags:
        - Admin Question Management
      summary: Update question (Admin)
      description: Updates existing question fields.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionRequest"
      responses:
        "200":
          description: Question updated.

    delete:
      tags:
        - Admin Question Management
      summary: Delete question (Admin)
      description: Deletes question by ID.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Question deleted.

  /question/{id}/bounty/activate:
    post:
      tags:
        - Admin Question Management
      summary: Activate bounty for question (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounty activated.

  /question/{id}/bounty/deactivate:
    post:
      tags:
        - Admin Question Management
      summary: Deactivate bounty for question (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounty deactivated.

  /question/{id}/testcases:
    get:
      tags:
        - Testcases
      summary: Get all testcases for question (Admin)
      description: Returns both public and hidden testcases for a question.
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Testcases list retrieved.

  /testcase:
    post:
      tags:
        - Testcases
      summary: Create testcase (Admin)
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestcaseRequest"
      responses:
        "200":
          description: Testcase created.

  /testcase/{id}:
    get:
      tags:
        - Testcases
      summary: Get testcase by ID (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Testcase retrieved.

    put:
      tags:
        - Testcases
      summary: Update testcase (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestcaseUpdateRequest"
      responses:
        "200":
          description: Testcase updated.

    delete:
      tags:
        - Testcases
      summary: Delete testcase (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Testcase deleted.

  /admin/session:
    get:
      tags:
        - Admin Contest Control
      summary: Verify admin session
      description: Verifies active JWT session has `admin` role.
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Admin session active.

  /admin/users:
    get:
      tags:
        - Admin User Management
      summary: List all registered users (Admin)
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Users list retrieved.

  /admin/users/{id}/ban:
    post:
      tags:
        - Admin User Management
      summary: Ban participant (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User banned.

  /admin/users/{id}/unban:
    post:
      tags:
        - Admin User Management
      summary: Unban participant (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User unbanned.

  /admin/users/{id}/upgrade:
    post:
      tags:
        - Admin User Management
      summary: Upgrade single user round (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeUserRequest"
      responses:
        "200":
          description: User upgraded.

  /admin/users/upgrade-all:
    post:
      tags:
        - Admin User Management
      summary: Bulk upgrade all users to round (Admin)
      security:
        - CookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeAllUsersRequest"
      responses:
        "200":
          description: All non-banned users upgraded.

  /admin/users/{id}/submissions:
    get:
      tags:
        - Admin User Management
      summary: Get submissions for user (Admin)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User submissions retrieved.

  /admin/leaderboard:
    get:
      tags:
        - Admin Contest Control
      summary: Fetch contest leaderboard (Admin)
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Leaderboard retrieved.

  /admin/analytics:
    get:
      tags:
        - Admin Contest Control
      summary: Fetch contest analytics (Admin)
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Analytics retrieved.

  /admin/setTime:
    post:
      tags:
        - Admin Contest Control
      summary: Configure contest round timer (Admin)
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTimeRequest"
      responses:
        "200":
          description: Contest timer configured.

  /admin/updateTime:
    post:
      tags:
        - Admin Contest Control
      summary: Update active contest round timer (Admin)
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeRequest"
      responses:
        "200":
          description: Contest timer updated.

  /admin/startRound:
    post:
      tags:
        - Admin Contest Control
      summary: Start round timer (Admin)
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Timer started.

  /admin/resetRound:
    post:
      tags:
        - Admin Contest Control
      summary: Reset round timer (Admin)
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Timer reset.

  /judge0callback:
    put:
      tags:
        - Submissions & Results
      summary: Judge0 async execution callback
      description: Internal callback endpoint invoked by Judge0 upon testcase compilation/execution completion.
      responses:
        "200":
          description: Callback processed and enqueued for async persistence.

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HTTP-only JWT access token cookie set upon OAuth login.

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error explanation message"
        code:
          type: string
          enum:
            - VALIDATION
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - ALREADY_EXISTS
            - RATE_LIMITED
            - INTERNAL
            - ROUND_NOT_RUNNING
            - NOT_QUALIFIED
            - NOT_PURCHASED
            - INSUFFICIENT_BALANCE
            - JUDGE_BUSY
            - JUDGE_FAILED
            - STILL_JUDGING
          example: "ROUND_NOT_RUNNING"
        errors:
          type: array
          items:
            type: object

    DashboardQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        points:
          type: integer
        round:
          type: integer
        attempt_status:
          type: string
          enum: [available, bought, answered]

    DashboardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        balance:
          type: string
        score:
          type: string
        round_qualified:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DashboardQuestion"

    DashboardResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: "#/components/schemas/DashboardResponse"

    TimerResponse:
      type: object
      properties:
        round:
          type: integer
        is_running:
          type: boolean
        duration:
          type: integer
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        time_left:
          type: integer

    TimerResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: "#/components/schemas/TimerResponse"

    SubmissionRequest:
      type: object
      required:
        - question_id
        - language_id
        - source_code
      properties:
        question_id:
          type: string
          format: uuid
        language_id:
          type: integer
        source_code:
          type: string

    CustomSubmissionRequest:
      type: object
      required:
        - language_id
        - source_code
      properties:
        source_code:
          type: string
        language_id:
          type: integer
        stdin:
          type: string

    SubmitVisualSolutionRequest:
      type: object
      required:
        - question_id
        - blocks
      properties:
        question_id:
          type: string
          format: uuid
        blocks:
          type: array
          items:
            type: string
            format: uuid

    SubmitVisualSolutionResponse:
      type: object
      properties:
        status:
          type: string
        points_awarded:
          type: number
        note:
          type: string
        correct:
          type: boolean
        already_answered:
          type: boolean

    SubmitVisualSolutionResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/SubmitVisualSolutionResponse"

    AttemptResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        question_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
        new_balance:
          type: number
        is_buy_in_paid:
          type: boolean

    AttemptResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/AttemptResponse"

    TestcaseResult:
      type: object
      properties:
        id:
          type: string
        runtime:
          type: number
        memory:
          type: number
        status:
          type: string
        description:
          type: string

    ResultResponse:
      type: object
      properties:
        id:
          type: string
        question_id:
          type: string
        passed:
          type: integer
        failed:
          type: integer
        runtime:
          type: number
        memory:
          type: number
        submission_time:
          type: string
        description:
          type: string
        testcases:
          type: array
          items:
            $ref: "#/components/schemas/TestcaseResult"

    ResultResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ResultResponse"

    QuestionRequest:
      type: object
      required:
        - title
        - description
        - type
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
        input_format:
          type: array
          items:
            type: string
        buy_in:
          type: number
        reward:
          type: number
        points:
          type: integer
        round:
          type: integer
        constraints:
          type: array
          items:
            type: string
        output_format:
          type: array
          items:
            type: string
        sample_test_input:
          type: array
          items:
            type: string
        sample_test_output:
          type: array
          items:
            type: string
        explanation:
          type: array
          items:
            type: string
        bounty_active:
          type: boolean

    TestcaseRequest:
      type: object
      required:
        - question_id
        - input
        - expected_output
      properties:
        question_id:
          type: string
          format: uuid
        input:
          type: string
        expected_output:
          type: string
        memory:
          type: number
        runtime:
          type: number
        hidden:
          type: boolean

    TestcaseUpdateRequest:
      type: object
      properties:
        question_id:
          type: string
          format: uuid
        input:
          type: string
        expected_output:
